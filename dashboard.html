<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="shell">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="brand-mark"><span class="dot"></span> Lalay Admin</div>

        <ul class="nav-group">
          <li
            class="nav-item is-active"
            data-view="shop"
            onclick="setView('shop')"
          >
            <span>Shop Management</span>
            <span id="navPendingBadge" class="nav-badge hidden">0</span>
          </li>
          <li
            class="nav-item"
            data-view="customers"
            onclick="setView('customers')"
          >
            <span>Customers</span>
          </li>
        </ul>

        <div class="sidebar-foot">
          <p class="sidebar-caption">Ca-Lalay &middot; Admin Panel</p>
          <button id="logoutBtn" class="btn-logout">Log out</button>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <div class="topbar">
          <div>
            <h1 id="topbarTitle">Shop management</h1>
            <p class="sub" id="topbarSub">
              Review and manage shop owner and freelancer accounts.
            </p>
          </div>
        </div>

        <!-- SHOP MANAGEMENT VIEW -->
        <section id="shopView">
          <div class="filter-row">
            <button
              type="button"
              class="filter-card is-active"
              data-filter="all"
              onclick="setShopFilter('all')"
            >
              <span class="filter-value" id="countAllValue">0</span>
              <span class="filter-label">All accounts</span>
            </button>
            <button
              type="button"
              class="filter-card"
              data-filter="pending"
              onclick="setShopFilter('pending')"
            >
              <span class="filter-value" id="countPendingValue">0</span>
              <span class="filter-label">Pending</span>
            </button>
            <button
              type="button"
              class="filter-card"
              data-filter="active"
              onclick="setShopFilter('active')"
            >
              <span class="filter-value" id="countActiveValue">0</span>
              <span class="filter-label">Active</span>
            </button>
            <button
              type="button"
              class="filter-card"
              data-filter="suspended"
              onclick="setShopFilter('suspended')"
            >
              <span class="filter-value" id="countSuspendedValue">0</span>
              <span class="filter-label">Suspended</span>
            </button>
            <button
              type="button"
              class="filter-card"
              data-filter="rejected"
              onclick="setShopFilter('rejected')"
            >
              <span class="filter-value" id="countRejectedValue">0</span>
              <span class="filter-label">Rejected</span>
            </button>
          </div>

          <div class="toolbar">
            <input
              id="searchInput"
              class="search-input"
              type="text"
              placeholder="Search by shop name or email…"
            />
          </div>

          <div class="table-card">
            <table>
              <thead>
                <tr>
                  <th>Account</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>

            <div id="emptyState" class="empty-state hidden">
              No accounts match this view.
            </div>
          </div>
        </section>

        <!-- CUSTOMERS VIEW -->
        <section id="customersView" class="hidden">
          <div class="toolbar">
            <input
              id="customerSearchInput"
              class="search-input"
              type="text"
              placeholder="Search by name or email…"
            />
          </div>

          <div class="table-card">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Contact</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="customerTableBody"></tbody>
            </table>

            <div id="customerEmptyState" class="empty-state hidden">
              No customers match your search.
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- DETAIL PANEL -->
    <div id="panelOverlay" class="panel-overlay hidden">
      <div id="detailPanel" class="detail-panel">
        <div class="panel-header">
          <span>ACCOUNT DETAILS</span>
          <button id="closePanel" class="panel-close">&times;</button>
        </div>
        <div id="panelBody"></div>
      </div>
    </div>

    <!-- FULL IMAGE LIGHTBOX -->
    <div id="lightbox" class="lightbox hidden">
      <button id="closeLightbox" class="lightbox-close">&times;</button>
      <img id="lightboxImg" src="" alt="Submitted document" />
    </div>

    <!-- REASON MODAL (reject / suspend) -->
    <div id="reasonModal" class="reason-overlay hidden">
      <div class="reason-modal">
        <h3 id="reasonModalTitle">Provide a reason</h3>
        <textarea
          id="reasonInput"
          rows="4"
          placeholder="Enter reason…"
        ></textarea>
        <p id="reasonError" class="error-msg hidden"></p>
        <div class="reason-actions">
          <button id="reasonCancelBtn" class="btn-secondary">Cancel</button>
          <button id="reasonConfirmBtn" class="btn-primary reason-confirm">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <!-- CONFIRM MODAL (approve, etc.) -->
    <div id="confirmModal" class="reason-overlay hidden">
      <div class="reason-modal">
        <h3 id="confirmModalTitle">Confirm action</h3>
        <p id="confirmModalMessage" class="confirm-message"></p>
        <div class="reason-actions">
          <button id="confirmCancelBtn" class="btn-secondary">Cancel</button>
          <button id="confirmConfirmBtn" class="btn-primary reason-confirm">
            Confirm
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/authCheck.js"></script>
    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
